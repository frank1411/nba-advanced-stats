name: NBA Daily Predictions

# Configuración de permisos para el token de GitHub
permissions:
  contents: write  # Permiso para hacer push a la rama
  pull-requests: write  # Permiso para actualizar PRs
  statuses: write  # Permiso para actualizar estados

on:
  schedule:
    # Se ejecuta todos los días a las 9:00 AM (hora de Venezuela, UTC-4)
    # Formato: minuto hora * * día-del-mes mes día-de-la-semana
    - cron: '0 13 * * *'  # 13:00 UTC = 9:00 AM Venezuela (UTC-4)
  workflow_dispatch:  # Permite ejecución manual desde la interfaz de GitHub
  push:
    branches:
      - desa
    paths:
      - '.github/workflows/daily_predictions.yml'
      - 'ML/**'  # Se activa con cambios en cualquier archivo de la carpeta ML
  pull_request:
    branches:
      - desa

jobs:
  nba-pipeline:
    # Solo ejecutar en la rama desa
    if: github.ref == 'refs/heads/desa'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Limpiar carpeta de predicciones
      run: |
        echo "🧹 Limpiando carpeta de predicciones..."
        # Crear directorio si no existe
        mkdir -p ML/data/predictions
        # Eliminar archivos existentes excepto .gitkeep
        find ML/data/predictions -type f ! -name '.gitkeep' -exec rm -f {} \;
        echo "✅ Carpeta de predicciones limpiada"
        ls -la ML/data/predictions/
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pandas pyarrow scikit-learn requests python-dateutil
    
    - name: Configurar estructura de directorios
      run: |
        # Crear estructura de directorios necesaria
        mkdir -p ML/data/raw ML/data/processed ML/data/predictions
        # Asegurar permisos
        chmod -R 777 ML/data/
        echo "✅ Estructura de directorios configurada"
    
    - name: Limpiar carpeta de predicciones
      run: |
        echo "🔍 Contenido de la carpeta de predicciones antes de limpiar:"
        ls -la ML/data/predictions/ 2>/dev/null || true
        
        # Asegurarse de que el directorio existe y tiene permisos
        mkdir -p ML/data/predictions
        chmod -R 777 ML/data/predictions
        
        # Eliminar archivos antiguos (más de 1 día)
        echo "🧹 Eliminando archivos antiguos..."
        find ML/data/predictions/ -type f -mtime +1 -exec rm -f {} \; 2>/dev/null || true
        
        # Limpiar archivos de predicciones del día actual
        TODAY=$(date +%Y%m%d)
        rm -f ML/data/predictions/predictions_${TODAY}.* 2>/dev/null || true
        
        echo "✅ Contenido de la carpeta después de limpiar:"
        ls -la ML/data/predictions/ 2>/dev/null || true
        echo "🗑️  Carpeta de predicciones limpiada correctamente"
    
    - name: Ejecutar actualización de datos de la NBA
      run: |
        echo "Ejecutando actualización de datos..."
        python ML/preprocessing/02_update_nba_data.py
    
    - name: Procesar conjunto de datos final
      run: |
        echo "Procesando conjunto de datos final..."
        python ML/preprocessing/03_process_final_dataset.py
    
    - name: Verificar archivos de modelo
      run: |
        echo "🔍 Verificando archivos de modelo..."
        python ML/verify_models.py
        echo "✅ Verificación de archivos completada"
    
    - name: Generar predicciones
      run: |
        echo "🔍 Estado actual del directorio de predicciones:"
        ls -la ML/data/predictions/ || true
        
        echo "🔮 Generando predicciones..."
        # Verificar que el directorio de salida existe y tiene permisos
        mkdir -p ML/data/predictions
        chmod -R 777 ML/data/predictions
        
        # Mostrar el directorio actual y el contenido
        echo "📂 Directorio actual: $(pwd)"
        echo "📂 Contenido del directorio ML/data/predictions:"
        ls -la ML/data/predictions/ || true
        
        # Ejecutar el script de predicciones
        echo "🚀 Ejecutando script de predicciones..."
        python ML/models/06_predict_upcoming_games.py
        
        # Verificar el código de salida
        PREDICTION_EXIT_CODE=$?
        echo "📊 Código de salida del script: $PREDICTION_EXIT_CODE"
        
        # Verificar que los archivos se hayan creado
        echo "🔍 Buscando archivos de predicciones generados..."
        ls -la ML/data/predictions/ || true
        
        # Verificar archivos específicos
        TODAY=$(date +%Y%m%d)
        if [ -f "ML/data/predictions/predictions_${TODAY}.md" ] && [ -f "ML/data/predictions/predictions_${TODAY}.csv" ]; then
          echo "✅ Archivos de predicciones generados correctamente:"
          echo "   - ML/data/predictions/predictions_${TODAY}.md"
          echo "   - ML/data/predictions/predictions_${TODAY}.csv"
          # Mostrar las primeras líneas del archivo MD para verificación
          echo "📝 Vista previa del archivo MD:"
          head -n 10 "ML/data/predictions/predictions_${TODAY}.md" || true
        else
          echo "❌ No se encontraron los archivos de predicciones esperados"
          echo "🔍 Buscando archivos recientes:"
          find ML/data/predictions/ -type f -mtime -1 -ls || true
          exit 1
        fi
    
    - name: Configurar Git
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        # Configurar el token de acceso (usando el token de GitHub Actions)
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    
    - name: Verificar cambios
      id: check_changes
      run: |
        # Asegurar que los directorios existen
        mkdir -p ML/data/processed ML/data/predictions
        
        # Agregar archivos al staging
        git add -f ML/data/processed/nba_games_final.* 2>/dev/null || true
        git add -f ML/data/processed/.gitkeep 2>/dev/null || true
        git add -f ML/data/predictions/.gitkeep 2>/dev/null || true
        
        # Copiar archivos de predicción para el artefacto
        mkdir -p predictions
        
        # Asegurar que los archivos tengan permisos de lectura
        chmod -R 644 ML/data/predictions/* 2>/dev/null || true
        
        # Copiar tanto CSV como MD para el artefacto
        cp ML/data/predictions/*.csv predictions/ 2>/dev/null || echo "No se encontraron archivos CSV de predicción"
        cp ML/data/predictions/*.md predictions/ 2>/dev/null || echo "No se encontraron archivos MD de predicción"
        
        # Agregar archivos de predicción al commit
        for file in ML/data/predictions/*; do
          if [ -f "$file" ]; then
            git add -f "$file" 2>/dev/null || echo "No se pudo agregar $file"
          fi
        done
        
        # Mostrar el estado de git para depuración
        echo "📊 Estado actual de git:"
        git status --porcelain ML/data/predictions/ || true
        
        # Verificar si hay cambios
        if [ -n "$(git status --porcelain)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "No hay cambios para hacer commit"
          echo "changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Hacer commit y push
      run: |
        # Crear el mensaje de commit
        COMMIT_MSG="feat: Actualizar predicciones NBA $(date +'%Y-%m-%d')"
        
        # Agregar archivos específicos
        git add ML/data/predictions/predictions_*.{csv,md} 2>/dev/null || true
        git add ML/data/processed/nba_games_final.* 2>/dev/null || true
        
        # Verificar si hay cambios para hacer commit
        if ! git diff --cached --quiet; then
          echo "🚀 Haciendo commit de los cambios..."
          git commit -m "$COMMIT_MSG"
          
          echo "🚀 Haciendo push a la rama desa..."
          git push origin desa
          echo "✅ Cambios subidos correctamente"
        else
          echo "ℹ️ No hay cambios para hacer commit"
          exit 0
        fi
        
        echo "✅ Cambios subidos correctamente"
      env:
        GIT_AUTHOR_NAME: GitHub Actions
        GIT_COMMITTER_NAME: GitHub Actions
        GIT_AUTHOR_EMAIL: actions@github.com
        GIT_COMMITTER_EMAIL: actions@github.com
    
    - name: Crear directorio de predicciones si no existe
      if: always()
      run: |
        mkdir -p predictions
        echo "Directorio de predicciones listo"
    
    - name: Subir predicciones
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nba-predictions
        path: predictions/
        if-no-files-found: ignore
        retention-days: 7
    
    # Sección de notificaciones deshabilitada - Configuración de Slack requerida
