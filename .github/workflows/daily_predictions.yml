name: NBA Daily Pipeline

on:
  schedule:
    # Se ejecuta todos los días a las 9:00 AM (hora de Venezuela, UTC-4)
    # Formato: minuto hora * * día-del-mes mes día-de-la-semana
    - cron: '0 13 * * *'  # 13:00 UTC = 9:00 AM Venezuela (UTC-4)
  workflow_dispatch:  # Permite ejecución manual desde la interfaz de GitHub
  push:
    branches:
      - desa
    paths:
      - '.github/workflows/daily_predictions.yml'
      - 'ML/**'  # Se activa con cambios en cualquier archivo de la carpeta ML
  pull_request:
    branches:
      - desa

jobs:
  nba-pipeline:
    # Solo ejecutar en la rama desa
    if: github.ref == 'refs/heads/desa'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pandas pyarrow scikit-learn requests python-dateutil
    
    - name: Limpiar carpeta de predicciones
      run: |
        rm -rf ML/data/predictions/*
        mkdir -p ML/data/predictions
        echo "Carpeta de predicciones limpiada correctamente"
    
    - name: Ejecutar actualización de datos de la NBA
      run: |
        echo "Ejecutando actualización de datos..."
        python ML/preprocessing/02_update_nba_data.py
    
    - name: Procesar conjunto de datos final
      run: |
        echo "Procesando conjunto de datos final..."
        python ML/preprocessing/03_process_final_dataset.py
    
    - name: Verificar archivos de modelo
      run: |
        echo "🔍 Verificando archivos de modelo..."
        python ML/verify_models.py
        echo "✅ Verificación de archivos completada"
    
    - name: Generar predicciones
      run: |
        echo "🔮 Generando predicciones..."
        python ML/models/06_predict_upcoming_games.py
        echo "✅ Predicciones generadas exitosamente"
    
    - name: Commit y Push de los cambios
      if: success()
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        # Forzar la adición de archivos necesarios
        git add -f ML/data/processed/nba_games_final.*
        git add -f ML/data/processed/.gitkeep
        git add ML/data/predictions/*
        # Verificar si hay cambios para hacer commit
        if git diff --cached --quiet; then
          echo "No hay cambios para hacer commit"
        else
          git commit -m "[Automated] Actualización de datos y predicciones NBA"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:desa
        fi
        if [ -d "ML/data/predictions" ]; then
          cp ML/data/predictions/*.csv predictions/ 2>/dev/null || echo "No se encontraron archivos de predicción"
        else
          echo "No se encontró el directorio de predicciones"
        fi
    
    - name: Crear directorio de predicciones si no existe
      if: always()
      run: |
        mkdir -p predictions
        echo "Directorio de predicciones listo"
    
    - name: Subir predicciones
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nba-predictions
        path: predictions/
        if-no-files-found: ignore
        retention-days: 7
    
    # Sección de notificaciones deshabilitada - Configuración de Slack requerida
