name: NBA Daily Predictions

# Configuración de permisos para el token de GitHub
permissions:
  contents: write  # Permiso para hacer push a la rama
  pull-requests: write  # Permiso para actualizar PRs
  statuses: write  # Permiso para actualizar estados

on:
  schedule:
    # Se ejecuta todos los días a las 9:00 AM (hora de Venezuela, UTC-4)
    # Formato: minuto hora * * día-del-mes mes día-de-la-semana
    - cron: '0 13 * * *'  # 13:00 UTC = 9:00 AM Venezuela (UTC-4)
  workflow_dispatch:  # Permite ejecución manual desde la interfaz de GitHub
  push:
    branches:
      - desa
    paths:
      - '.github/workflows/daily_predictions.yml'
      - 'ML/**'  # Se activa con cambios en cualquier archivo de la carpeta ML
  pull_request:
    branches:
      - desa

jobs:
  nba-pipeline:
    # Solo ejecutar en la rama desa
    if: github.ref == 'refs/heads/desa'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pandas pyarrow scikit-learn requests python-dateutil
    
    - name: Limpiar carpeta de predicciones
      run: |
        rm -rf ML/data/predictions/*
        mkdir -p ML/data/predictions
        echo "Carpeta de predicciones limpiada correctamente"
    
    - name: Ejecutar actualización de datos de la NBA
      run: |
        echo "Ejecutando actualización de datos..."
        python ML/preprocessing/02_update_nba_data.py
    
    - name: Procesar conjunto de datos final
      run: |
        echo "Procesando conjunto de datos final..."
        python ML/preprocessing/03_process_final_dataset.py
    
    - name: Verificar archivos de modelo
      run: |
        echo "🔍 Verificando archivos de modelo..."
        python ML/verify_models.py
        echo "✅ Verificación de archivos completada"
    
    - name: Generar predicciones
      run: |
        echo "🔮 Generando predicciones..."
        python ML/models/06_predict_upcoming_games.py
        echo "✅ Predicciones generadas exitosamente"
    
    - name: Configurar Git
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        # Configurar el token de acceso (usando el token de GitHub Actions)
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    
    - name: Verificar cambios
      id: check_changes
      run: |
        # Asegurar que los directorios existen
        mkdir -p ML/data/processed ML/data/predictions
        
        # Agregar archivos al staging
        git add -f ML/data/processed/nba_games_final.* 2>/dev/null || true
        git add -f ML/data/processed/.gitkeep 2>/dev/null || true
        git add -f ML/data/predictions/.gitkeep 2>/dev/null || true
        
        # Agregar archivos de predicción
        if [ -d "ML/data/predictions" ]; then
          # Copiar archivos de predicción para el artefacto
          mkdir -p predictions
          cp ML/data/predictions/*.csv predictions/ 2>/dev/null || echo "No se encontraron archivos de predicción"
          
          # Agregar archivos de predicción al commit
          for file in ML/data/predictions/*.csv; do
            if [ -f "$file" ]; then
              git add -f "$file" 2>/dev/null || true
            fi
          done
        else
          echo "No se encontró el directorio de predicciones"
        fi
        
        # Verificar si hay cambios
        if [ -n "$(git status --porcelain)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
        else
          echo "No hay cambios para hacer commit"
          echo "changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Hacer commit y push
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        # Configurar Git para hacer rebase por defecto
        git config --global pull.rebase true
        
        # Hacer pull con rebase primero
        git pull --rebase origin desa || {
          echo "⚠️ Error al hacer pull. Intentando continuar..."
          git rebase --abort 2>/dev/null || true
          exit 1
        }
        
        # Hacer commit de los cambios locales
        git commit -m "[Automated] Actualización de datos y predicciones NBA" || {
          echo "⚠️ No hay cambios para hacer commit"
          exit 0
        }
        
        # Hacer push de los cambios
        git push origin desa || {
          echo "⚠️ Falló el push. Haciendo pull y reintentando..."
          git pull --rebase origin desa
          git push origin desa || {
            echo "❌ Error al hacer push después del rebase"
            exit 1
          }
        }
        
        echo "✅ Cambios subidos correctamente"
      env:
        GIT_AUTHOR_NAME: GitHub Actions
        GIT_COMMITTER_NAME: GitHub Actions
        GIT_AUTHOR_EMAIL: actions@github.com
        GIT_COMMITTER_EMAIL: actions@github.com
    
    - name: Crear directorio de predicciones si no existe
      if: always()
      run: |
        mkdir -p predictions
        echo "Directorio de predicciones listo"
    
    - name: Subir predicciones
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nba-predictions
        path: predictions/
        if-no-files-found: ignore
        retention-days: 7
    
    # Sección de notificaciones deshabilitada - Configuración de Slack requerida
