name: Verify Environment

on:
  workflow_dispatch:  # Permite ejecución manual
  push:
    branches: [ main ]
    paths:
      - 'ML/scripts/verify_environment.py'
      - '.github/workflows/verify_environment.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas scikit-learn joblib pyarrow scipy
        
    - name: Run verification
      run: |
        mkdir -p ML/reports
        python ML/scripts/verify_environment.py
        
    - name: Upload verification report
      uses: actions/upload-artifact@v4
      with:
        name: environment-verification-report
        path: ML/reports/
        retention-days: 5
        
    - name: Show report summary
      run: |
        echo "=== Environment Verification Report ==="
        echo "Generated at: $(date)"
        echo ""
        cat ML/reports/environment_verification.txt
        
        # Check for critical differences
        if grep -q "ERROR" ML/reports/environment_verification.txt; then
          echo "\n❌ Critical issues found in the environment verification!"
          exit 1
        else
          echo "\n✅ Environment verification completed successfully"
        fi
